plugins {
  id 'scala'
  id 'io.github.cosmicsilence.scalafix' version '0.2.6'
}

apply from: "$projectDir/gradle/dependencies.gradle"

repositories {
  mavenCentral()
}

dependencies {
  implementation(
    [ libs.scala
    , libs.sprayJSON
    , libs.typesafe_config
    , libs.aws_s3
    , libs.aws_dynamodb
    , libs.aws_secretsmanager
    , libs.aws_lambda_core
    ]
  )
  testImplementation libs.scalaTest
  testRuntimeOnly 'co.helmethair:scalatest-junit-runner:0.2.0'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

tasks.withType(ScalaCompile) {
}

sourceSets {
  main {
    scala.srcDir "source/scala"
    compileClasspath += files("source/scala", "build/classes/macros")
    resources.srcDirs = files("source/resources")
    ext.set('allScala', scala)  // scalafix plugin expects allScala (Gradle 9 / Scala plugin compatibility)
  }
  test {
    scala.srcDir "source/test/scala"
    resources.srcDirs = files("source/test/resources")
    ext.set('allScala', scala)
  }
}

test {
  useJUnitPlatform()
}

compileScala {
}

tasks.withType(ScalaCompile).configureEach {
  scalaCompileOptions.additionalParameters = ['-Wunused:imports']
}

jar {
  manifest {
    attributes(
      [ "Implementation-Title"   : "mbtalive"
      , "Implementation-Version" : "2.0"
      , "Implementation-Vendor"  : "github://Deepgrant"
      ]
    )
  }
}

task copyRuntimeDeps(type: Sync, dependsOn: jar) {
  description = 'Assemble the exact Lambda application and runtime JAR set'
  from configurations.runtimeClasspath
  from jar.archiveFile
  into "$buildDir/lambda/lib"
}

task cleanFrontend(type: Delete) {
  delete "$projectDir/frontend/dist"
}

task cleanAll(dependsOn: [clean, cleanFrontend]) {
  description = 'Clean Scala build output and Angular frontend dist'
}

task printClasspath {
  doLast {
    configurations.runtimeClasspath.each { println it }
  }
}

task snapshotDev(type: JavaExec, dependsOn: classes) {
  description = 'Run the local scheduled snapshot publisher and API server on http://localhost:8080'
  mainClass = 'mbta.snapshot.SnapshotDevMain'
  classpath sourceSets.main.runtimeClasspath
}

apply from: "$projectDir/deploy.gradle"
